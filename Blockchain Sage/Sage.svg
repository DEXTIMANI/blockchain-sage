<svg width="200" height="200" viewBox="0 0 200 200"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <radialGradient id="goldGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe9a3"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8f6b1f"/>
    </radialGradient>

    <radialGradient id="bronzeGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c87a2c"/>
      <stop offset="100%" stop-color="#6b3a0a"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6"
                    flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <path id="topArc" d="M 30,100 A 70,70 0 0,1 170,100"/>
    <path id="bottomArc" d="M 170,100 A 70,70 0 0,1 30,100"/>
  </defs>

  <!-- Outer coin -->
  <circle cx="100" cy="100" r="90"
          fill="url(#goldGradient)"
          filter="url(#shadow)"/>

  <!-- Inner coin -->
  <circle cx="100" cy="100" r="70"
          fill="url(#bronzeGradient)"/>

  <!-- Top curved text -->
  <text font-size="18"
        font-weight="bold"
        fill="#5a3b00"
        font-family="Arial, Helvetica, sans-serif"
        letter-spacing="4">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      SAGE
    </textPath>
  </text>

  <!-- Bottom curved text -->
  <text font-size="18"
        font-weight="bold"
        fill="#5a3b00"
        font-family="Arial, Helvetica, sans-serif"
        letter-spacing="4">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      TOKEN
    </textPath>
  </text>

  <!-- Dollar sign -->
  <text x="100" y="128"
        text-anchor="middle"
        font-size="90"
        font-weight="bold"
        fill="#f1c232"
        font-family="Arial, Helvetica, sans-serif">
    $
  </text>

</svg>