<!DOCTYPE html> <html> <head> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <style> body{ margin:0; background:black; font-family:Arial; color:white; text-align:center; overflow-x:hidden; } /* animated grid */ .grid{ position:fixed; width:100%; height:100%; z-index:-2; background: linear-gradient(#00ff8840 1px, transparent 1px), linear-gradient(90deg,#00ff8840 1px, transparent 1px); background-size:60px 60px; animation:gridMove 10s linear infinite; } @keyframes gridMove{ 0%{transform:translate(0,0)} 100%{transform:translate(-60px,-60px)} } canvas{ position:fixed; top:0; left:0; z-index:-1; } /* youtube banner */ .youtubeBanner{ margin-top:60px; border-radius:20px; border:3px solid #00ff88; display:inline-block; box-shadow: 0 0 20px #00ff88; } .youtubeBanner img{ width:260px; border-radius:18px; } /* watch now */ .watch{ margin-top:15px; display:flex; justify-content:center; align-items:center; gap:10px; font-size:26px; color:#ffc400; text-shadow: 0 0 10px #ffc400; } .watch img{ width:36px; } /* follow text */ .follow{ font-size:36px; margin-top:40px; color:#7CFF9E; text-shadow:0 0 12px #00ff88; } /* grid layout */ .icons{ display:grid; grid-template-columns:repeat(3,1fr); gap:35px; max-width:500px; margin:auto; margin-top:40px; padding:20px; } /* icon tile */ .tile{ width:95px; height:95px; border-radius:22px; background:linear-gradient(180deg,#101010,#000); border:2px solid #ffc400; display:flex; align-items:center; justify-content:center; box-shadow: 0 0 12px #ffc400, 0 0 24px #ffc400, inset 0 0 10px #000; transition:.3s; } /* hover */ .tile:hover{ transform:scale(1.1); box-shadow: 0 0 18px #ffc400, 0 0 35px #ffc400, 0 0 60px #ffc400; } /* icon images */ .tile img{ width:48px; filter:brightness(0) saturate(100%) invert(86%) sepia(82%) saturate(746%) hue-rotate(2deg) brightness(103%) contrast(102%); } /* labels */ .label{ margin-top:8px; color:#ffc400; } /* website button */ .website{ margin:40px auto; width:260px; border:2px solid #ffc400; border-radius:14px; padding:12px; color:#ffc400; font-size:22px; box-shadow: 0 0 10px #ffc400, 0 0 25px #ffc400; transition:.3s; } .website:hover{ background:#ffc400; color:black; box-shadow: 0 0 18px #ffc400, 0 0 40px #ffc400; } </style> </head> <body> <div class="grid"></div> <canvas id="net"></canvas> <!-- YOUTUBE BANNER --> <a href="https://www.youtube.com/channel/UCwnCr0rg-K_OZNRG3J0uIWw/join"> <div class="youtubeBanner"> <img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png"> </div> </a> <!-- WATCH NOW --> <div class="watch"> <img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png"> Watch Now! </div> <!-- FOLLOW US --> <div class="follow"> Follow Us </div> <div class="icons"> <a href="https://x.com/Bl0ckchainsage?t=0ZpswB56F4tG8KeFedwAsw&s=09"> <div class="tile"> <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg"> </div> <div class="label">X</div> </a> <a href="#"> <div class="tile"> <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg"> </div> <div class="label">Facebook</div> </a> <a href="https://wa.me/"> <div class="tile"> <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/whatsapp.svg"> </div> <div class="label">WhatsApp</div> </a> <a href="https://t.me/IAMBlockchainsage"> <div class="tile"> <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/telegram.svg"> </div> <div class="label">Telegram</div> </a> <a href="https://t.me/DecentralizedSagetoken"> <div class="tile"> <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg"> </div> <div class="label">Instagram</div> </a> <a href="mailto:"> <div class="tile"> <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/gmail.svg"> </div> <div class="label">Mail</div> </a> <a href="https://www.tiktok.com/@bl0ckchainsage?_r=1&_t=ZS-94NoIKGHCpE"> <div class="tile"> <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/tiktok.svg"> </div> <div class="label">TikTok</div> </a> <a href="https://x.com/Sagetokens"> <div class="tile"> <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg"> </div> <div class="label">Sage Token</div> </a> </div> <a href="https://blockchain-sage.com"> <div class="website"> OFFICIAL WEBSITE </div> </a> <script> /* blockchain particle network */ const c=document.getElementById("net"); const x=c.getContext("2d"); c.width=window.innerWidth; c.height=window.innerHeight; let p=[]; for(let i=0;i<60;i++){ p.push({ x:Math.random()*c.width, y:Math.random()*c.height, dx:(Math.random()-.5)*0.7, dy:(Math.random()-.5)*0.7 }) } function draw(){ x.clearRect(0,0,c.width,c.height); for(let i=0;i<p.length;i++){ let a=p[i]; a.x+=a.dx; a.y+=a.dy; if(a.x<0||a.x>c.width)a.dx*=-1; if(a.y<0||a.y>c.height)a.dy*=-1; x.beginPath(); x.arc(a.x,a.y,2,0,6.28); x.fillStyle="#00ff88"; x.fill(); for(let j=i+1;j<p.length;j++){ let b=p[j]; let d=Math.hypot(a.x-b.x,a.y-b.y); if(d<120){ x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.strokeStyle="rgba(0,255,120,"+(1-d/120)+")"; x.stroke(); } } } requestAnimationFrame(draw); } draw(); </script> </body> </html>
