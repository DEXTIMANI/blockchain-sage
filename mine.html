<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Blockchain Sage</title>

  <style>
    body {
      margin: 0;
      background: black url('images/pagecover.jpg') center/cover no-repeat fixed;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    /* === Animation Base === */
    h1, h2, h3, h4, p, img, section, nav, footer, .btn {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.9s ease;
    }

    .visible {
      opacity: 1 !important;
      transform: translateY(0) !important;
    }

    /* === Glass Text Box === */
    p {
      background: rgba(0, 0, 0, 0.45);
      border-radius: 10px;
      padding: 12px 20px;
      display: inline-block;
      backdrop-filter: blur(6px);
      max-width: 80%;
    }

    /* === Floating Icons === */
    .fixed-icons {
      position: fixed;
      top: 50%;
      left: 20px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 9999;
    }

    .fixed-icons img {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      opacity: 0.6;
      transition: 0.3s;
    }

    .fixed-icons img:hover {
      transform: translateX(8px) scale(1.15);
      opacity: 1;
      box-shadow: 0 0 15px rgba(0,150,255,0.8);
    }

    /* === Button Group === */
    .button-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin: 40px auto;
    }

    /* === Play Store Badge Button === */
    .playstore-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, #1a73e8, #34a853);
      padding: 14px 22px;
      border-radius: 50px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      transition: 0.3s;
      animation: pulse 2s infinite;
    }

    .playstore-btn img {
      width: 28px;
    }

    .playstore-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(0,150,255,0.9);
    }

    /* === Pulse Animation === */
    @keyframes pulse {
      0% { box-shadow: 0 0 0 rgba(0,150,255,0.5); }
      50% { box-shadow: 0 0 20px rgba(0,150,255,0.9); }
      100% { box-shadow: 0 0 0 rgba(0,150,255,0.5); }
    }

    footer {
      padding: 40px;
      color: pink;
      background: rgba(0,0,0,0.6);
      margin-top: 50px;
    }
  </style>
</head>

<body>

  <!-- CONTACT ICONS -->
  <div class="fixed-icons">
    <a href="https://whatsapp.com/channel/0029VbAQrDuHbFV0j8sLVv0X" target="_blank"><img src="icons/whatsapp.png"></a>
    <a href="mailto:nobodyissage@gmail.com"><img src="icons/mail.png"></a>
    <a href="https://www.facebook.com/profile.php?id=61560317553974" target="_blank"><img src="icons/Facebook.jpg"></a>
    <a href="https://t.me/IAMBlockchainsage" target="_blank"><img src="icons/telegram.png"></a>
    <a href="https://x.com/Bl0ckchainsage" target="_blank"><img src="icons/x.png"></a>
    <a href="https://youtube.com/@BlockchainSAGE" target="_blank"><img src="icons/youtube.png"></a>
  </div>

  <header>
    <h2>TIME TO MAKE REAL MONEY</h2>
  </header>

  <section class="main-content">

    <p>1. Download the Blockchain Sage app</p><br>
    <p>2. Sign up</p><br>
    <p>3. Start Mining</p>

    <div class="button-group">
      <a href="https://play.google.com/store/apps/details?id=com.dex.blockchainsage" 
         class="playstore-btn btn" 
         target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg">
        Get it on Play Store
      </a>
    </div>

    <footer>
      © Blockchain Sage 2026 - All rights reserved
    </footer>

  </section>

  <script>
    const elements = document.querySelectorAll("h1, h2, h3, h4, p, img, section, nav, footer, .btn");

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add("visible");
        }
      });
    }, { threshold: 0.1 });

    elements.forEach(el => observer.observe(el));
  </script>

</body>
</html>
